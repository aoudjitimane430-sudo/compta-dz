name: Build Compta DZ Setup

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check original app is at repo root
        shell: bash
        run: |
          if [ ! -f ai_studio_code.html ]; then
            echo "ERREUR: ai_studio_code.html doit etre a la racine du depot"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Electron files
        shell: bash
        run: |
          cat > main.js <<'EOF'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          function createWindow() {
            const win = new BrowserWindow({
              width: 1360, height: 900, minWidth: 900, minHeight: 650,
              title: 'Compta DZ', autoHideMenuBar: true,
              webPreferences: { contextIsolation: true, nodeIntegration: false }
            });
            win.loadFile(path.join(__dirname, 'ai_studio_code.html'));
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => app.quit());
          EOF
          cat > package.json <<'EOF'
          {
            "name": "compta-dz",
            "version": "1.0.0",
            "description": "Compta DZ - Logiciel comptable et fiscal SCF",
            "main": "main.js",
            "author": "Compta DZ",
            "license": "UNLICENSED",
            "scripts": { "dist": "electron-builder --win nsis --x64 --publish never" },
            "devDependencies": { "electron": "^35.0.0", "electron-builder": "^26.0.12" },
            "build": {
              "appId": "dz.comptadz.app",
              "productName": "Compta DZ",
              "files": ["main.js", "ai_studio_code.html", "package.json"],
              "directories": { "output": "dist" },
              "win": { "target": [{ "target": "nsis", "arch": ["x64"] }], "artifactName": "Compta-DZ-Setup.exe" },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "Compta DZ",
                "artifactName": "Compta-DZ-Setup.exe"
              }
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build Setup.exe
        run: npm run dist

      - name: Publish release (direct .exe download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Compta DZ v1.0.${{ github.run_number }}
          files: dist/Compta-DZ-Setup.exe
          make_latest: true
